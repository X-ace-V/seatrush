# Shard list used by every process: shard 0 is the original primary + replica
# (behind PgBouncer) and also holds the catalog; shards 1 and 2 are extra
# primaries. Containers reach them by service name.
x-shards: &shards >-
  [{"primary":"postgres://seatrush:seatrush@pgbouncer:5432/seatrush","replica":"postgres://seatrush:seatrush@pgbouncer-replica:5432/seatrush"},
   {"primary":"postgres://seatrush:seatrush@shard1:5432/seatrush"},
   {"primary":"postgres://seatrush:seatrush@shard2:5432/seatrush"}]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seatrush
      POSTGRES_PASSWORD: seatrush
      POSTGRES_DB: seatrush
    ports: ["5432:5432"]
    # PG_CPUS caps each shard's CPU, so one laptop can model shards as
    # separate fixed-size machines. Default 10 = effectively uncapped.
    cpus: ${PG_CPUS:-10}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
    healthcheck: &pg-health
      test: ["CMD", "pg_isready", "-U", "seatrush"]
      interval: 2s
      retries: 30

  # Streaming read replica. On first start it clones the primary with
  # pg_basebackup (-R writes the standby config), then replays WAL forever.
  # REPLICA_DELAY injects replication lag, e.g. REPLICA_DELAY=500ms.
  postgres-replica:
    image: postgres:16
    user: postgres
    environment:
      PGPASSWORD: replicator
    command: >
      bash -c "[ -s $$PGDATA/PG_VERSION ] || pg_basebackup -h postgres -U replicator -D $$PGDATA -R -X stream
      && chmod 700 $$PGDATA
      && exec postgres -c recovery_min_apply_delay=${REPLICA_DELAY:-0}"
    ports: ["5433:5432"]
    healthcheck: *pg-health
    depends_on:
      postgres: { condition: service_healthy }

  # Stateless API. Scale with: docker compose up -d --scale app=N
  # No host port: traffic enters through nginx so replicas don't fight over :3000.
  app:
    build: .
    environment:
      SHARDS: *shards
      PARTITION_BY: ${PARTITION_BY:-section}
      PG_POOL_SIZE: ${PG_POOL_SIZE:-10}
      READS_FROM: ${READS_FROM:-replica}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_MS: ${CACHE_TTL_MS:-1000}
      HOLD_SECONDS: ${HOLD_SECONDS:-300}
      MAX_DB_QUEUE: ${MAX_DB_QUEUE:-50}
      WAITING_ROOM: ${WAITING_ROOM:-off}
      ADMIT_PER_SEC: ${ADMIT_PER_SEC:-2000}
      LOG_LEVEL: warn
    depends_on:
      pgbouncer: { condition: service_started }
      pgbouncer-replica: { condition: service_started }
      shard1: { condition: service_healthy }
      shard2: { condition: service_healthy }
      redis: { condition: service_started }
    # Ready means serving HTTP, not just "process started". `up --wait` blocks on this.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 15

  # Connection pooler. Apps may open thousands of client connections;
  # pgbouncer multiplexes them onto DEFAULT_POOL_SIZE real Postgres connections.
  # Transaction mode returns a server connection to the pool after every
  # transaction, which is safe because each booking is a single statement.
  pgbouncer: &pgbouncer
    image: edoburu/pgbouncer:v1.26.0-p0
    environment: &pgb-env
      DATABASE_URL: postgres://seatrush:seatrush@postgres:5432/seatrush
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: ${PGB_POOL_SIZE:-40}
    depends_on:
      postgres: { condition: service_healthy }

  # Extra shards: plain primaries. 4 app replicas x PG_POOL_SIZE 10 = 40
  # connections each, under the default limit of 100, so no PgBouncer here.
  shard1: &shard
    image: postgres:16
    environment:
      POSTGRES_USER: seatrush
      POSTGRES_PASSWORD: seatrush
      POSTGRES_DB: seatrush
    ports: ["5441:5432"]
    cpus: ${PG_CPUS:-10}
    healthcheck: *pg-health

  shard2:
    <<: *shard
    ports: ["5442:5432"]

  # Same pooler, pointed at the replica, for read traffic.
  pgbouncer-replica:
    <<: *pgbouncer
    environment:
      <<: *pgb-env
      DATABASE_URL: postgres://seatrush:seatrush@postgres-replica:5432/seatrush
    depends_on:
      postgres-replica: { condition: service_healthy }

  # Single-node Kafka in KRaft mode (no ZooKeeper). Pinned to 3.9 because
  # kafkajs does not support the protocol versions Kafka 4 dropped.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 20

  # Publishes outbox rows to Kafka. The API itself never talks to Kafka.
  outbox-relay:
    build: .
    command: ["node", "src/outbox-relay.ts"]
    environment:
      SHARDS: *shards
      PARTITION_BY: ${PARTITION_BY:-section}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
      pgbouncer: { condition: service_started }

  # Consumes payment requests from Kafka and charges the (simulated) provider.
  payment-worker:
    build: .
    command: ["node", "src/payment-worker.ts"]
    restart: unless-stopped   # it exits on a failed batch so Kafka redelivers it
    environment:
      SHARDS: *shards
      PARTITION_BY: ${PARTITION_BY:-section}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
      pgbouncer: { condition: service_started }

  # Seat map cache. Nothing durable lives here, so no persistence.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  nginx:
    image: nginx:1.27-alpine
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["8080:80"]
    depends_on: [app]

  # ---- observability ----
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  # Commits/s, connections, replication lag. One exporter per database.
  pg-exporter: &pg-exporter
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://seatrush:seatrush@postgres:5432/seatrush?sslmode=disable
    depends_on: [postgres]

  pg-exporter-replica:
    <<: *pg-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://seatrush:seatrush@postgres-replica:5432/seatrush?sslmode=disable
    depends_on: [postgres-replica]

  pg-exporter-shard1:
    <<: *pg-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://seatrush:seatrush@shard1:5432/seatrush?sslmode=disable
    depends_on: [shard1]

  pg-exporter-shard2:
    <<: *pg-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://seatrush:seatrush@shard2:5432/seatrush?sslmode=disable
    depends_on: [shard2]

  # Consumer group lag: how far the payment worker is behind.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    restart: on-failure   # exits if Kafka is down at startup
    depends_on:
      kafka: { condition: service_healthy }

  # Dashboard at http://localhost:3001, provisioned from observability/grafana.
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin     # local only: no login screen
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/seatrush.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
