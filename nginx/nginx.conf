# Round-robin load balancer in front of every `app` replica.
# Docker DNS returns one IP per replica. `resolve` makes nginx re-query it
# every few seconds, so scaling up or down needs no nginx restart. Without
# it, nginx kept dead replica IPs after a scale-down and timed out on them.
worker_processes auto;
events { worker_connections 8192; }

http {
  access_log off;
  resolver 127.0.0.11 valid=2s ipv6=off;   # Docker's embedded DNS

  upstream api {
    zone api 64k;               # shared memory, required for `resolve`
    server app:3000 resolve;
    keepalive 128;              # reuse connections to the app instead of a new TCP handshake per request
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout;   # retry another replica if one just went away
    }
  }
}
