# Scrapes every 2s so dashboards move in near real time during a load test.
# dns_sd_configs resolves a compose service to ALL its replica IPs, so
# `--scale app=N` is picked up without touching this file.
global:
  scrape_interval: 2s

scrape_configs:
  - job_name: app
    dns_sd_configs: [{ names: [app], type: A, port: 3000, refresh_interval: 5s }]
  - job_name: payment-worker
    dns_sd_configs: [{ names: [payment-worker], type: A, port: 9100, refresh_interval: 5s }]
  - job_name: outbox-relay
    static_configs: [{ targets: ['outbox-relay:9100'] }]
  - job_name: postgres
    static_configs:
      - { targets: ['pg-exporter:9187'], labels: { db: shard0 } }
      - { targets: ['pg-exporter-replica:9187'], labels: { db: shard0-replica } }
      - { targets: ['pg-exporter-shard1:9187'], labels: { db: shard1 } }
      - { targets: ['pg-exporter-shard2:9187'], labels: { db: shard2 } }
  - job_name: kafka
    static_configs: [{ targets: ['kafka-exporter:9308'] }]
