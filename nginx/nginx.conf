# Round-robin load balancer in front of every `app` replica.
# Docker DNS returns one IP per replica; nginx resolves them at startup,
# so restart nginx after scaling (the sweep script does this).
worker_processes auto;
events { worker_connections 8192; }

http {
  access_log off;

  upstream api {
    server app:3000;
    keepalive 128;              # reuse connections to the app instead of a new TCP handshake per request
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
